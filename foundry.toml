[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./src" }, { access = "read", path = "./README.md" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 20
fail_on_revert = false

[fmt]
line_length = 120

# Public RPCs only. Scripts in this repo do not broadcast.
[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
